<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Karaoke</title>
</head>
<body>
    <div id="KaraokeConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="KaraokeConfigForm">
                    <div class="verticalSection">
                        <h2 class="sectionTitle">Karaoke</h2>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="InjectClientScript" name="InjectClientScript" type="checkbox" is="emby-checkbox" />
                            <span>Add the karaoke button to the web client</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription">Reload the browser tab after changing this.</div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="AutoQueueOnUse" name="AutoQueueOnUse" type="checkbox" is="emby-checkbox" />
                            <span>Queue a song for AI separation the first time karaoke mode is used on it</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription">The separation worker picks queued songs up in the background.</div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="ClaimTimeoutMinutes">Worker timeout (minutes)</label>
                        <input id="ClaimTimeoutMinutes" name="ClaimTimeoutMinutes" type="number" is="emby-input" min="5" />
                        <div class="fieldDescription">A song a worker has held longer than this goes back in the queue.</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>

                <div class="verticalSection" style="margin-top:2em">
                    <h2 class="sectionTitle">Queue a song, album or playlist</h2>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="KaraokeQueueId">Item ID</label>
                        <input id="KaraokeQueueId" type="text" is="emby-input" />
                        <div class="fieldDescription">The ID is the last part of the item's page address, after "id=".</div>
                    </div>
                    <button is="emby-button" type="button" id="KaraokeQueueButton" class="raised emby-button"><span>Queue</span></button>
                </div>

                <div class="verticalSection" style="margin-top:2em">
                    <h2 class="sectionTitle">Separation queue</h2>
                    <div id="KaraokeQueueSummary" class="fieldDescription"></div>
                    <div id="KaraokeQueueList"></div>
                </div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var pluginId = '7c1b3f0e-5d2a-4e8b-9a6f-2f4d8c1e7b53';
                var page = document.querySelector('#KaraokeConfigPage');

                function pick(o, name) {
                    if (!o) return undefined;
                    var lower = name.charAt(0).toLowerCase() + name.slice(1);
                    return o[name] !== undefined ? o[name] : o[lower];
                }

                function call(path, method) {
                    return fetch(ApiClient.getUrl(path), {
                        method: method || 'GET',
                        headers: { Authorization: 'MediaBrowser Token="' + ApiClient.accessToken() + '"' }
                    }).then(function (r) {
                        if (!r.ok) throw new Error(path + ' returned ' + r.status);
                        return r.status === 204 ? null : r.json();
                    });
                }

                function loadQueue() {
                    call('Karaoke/Queue').then(function (q) {
                        var jobs = pick(q, 'Jobs') || [];
                        page.querySelector('#KaraokeQueueSummary').textContent =
                            pick(q, 'ReadyCount') + ' songs ready, ' + jobs.length + ' in the queue.';
                        var list = page.querySelector('#KaraokeQueueList');
                        list.textContent = '';
                        jobs.forEach(function (j) {
                            var row = document.createElement('div');
                            row.className = 'listItem listItem-border';
                            var err = pick(j, 'Error');
                            row.textContent = pick(j, 'Name') + ': ' + pick(j, 'State') + (err ? ' (' + err + ')' : '');
                            list.appendChild(row);
                        });
                    }).catch(function (e) {
                        page.querySelector('#KaraokeQueueSummary').textContent = 'Could not load the queue: ' + e.message;
                    });
                }

                page.addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        page.querySelector('#InjectClientScript').checked = config.InjectClientScript;
                        page.querySelector('#AutoQueueOnUse').checked = config.AutoQueueOnUse;
                        page.querySelector('#ClaimTimeoutMinutes').value = config.ClaimTimeoutMinutes;
                        Dashboard.hideLoadingMsg();
                    });
                    loadQueue();
                });

                page.querySelector('#KaraokeConfigForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        config.InjectClientScript = page.querySelector('#InjectClientScript').checked;
                        config.AutoQueueOnUse = page.querySelector('#AutoQueueOnUse').checked;
                        config.ClaimTimeoutMinutes = parseInt(page.querySelector('#ClaimTimeoutMinutes').value, 10) || 240;
                        ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });
                    return false;
                });

                page.querySelector('#KaraokeQueueButton').addEventListener('click', function () {
                    var id = page.querySelector('#KaraokeQueueId').value.trim();
                    if (!id) return;
                    call('Karaoke/Items/' + encodeURIComponent(id) + '/Queue', 'POST').then(function (r) {
                        Dashboard.alert(pick(r, 'Queued') + ' song(s) added to the queue.');
                        loadQueue();
                    }).catch(function (e) {
                        Dashboard.alert('Could not queue that item: ' + e.message);
                    });
                });
            })();
        </script>
    </div>
</body>
</html>
